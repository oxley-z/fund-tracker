name: Weekly CFTC Data Update

on:
  schedule:
    # 第一次：每周六 06:30 北京时间（UTC 周五 22:30）
    # CFTC 官方节奏是周二持仓、周五 15:30 ET 发布；Socrata 偶尔延迟，故每周跑两次。
    - cron: '30 22 * * 5'
    # 第二次：每周日 06:00 北京时间（UTC 周六 22:00）—— 兜底补跑
    # （Socrata 数据集有时要到周六白天才真正可查，只跑一次会整整落下一周）
    - cron: '0 22 * * 6'
  workflow_dispatch: # 支持手动点击立即执行

permissions:
  contents: write  # 必须具有写入权限以持久化提交数据与缓存
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-cftc-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1. 抓取最新一期 CFTC 报告写入 report/
      - name: Fetch Latest CFTC Report
        run: |
          python cftc_position_analysis.py

      # 2. 匹配历史价格，生成 cftc_dashboard.html，更新 JSON 缓存
      - name: Generate CFTC Dashboard & Update Price Cache
        run: |
          python cftc_generate_dashboard.py

      # 3. 将新抓取的原始报告 HTML 及更新后的 JSON 缓存提交并推送到 GitHub 仓库
      # ★ 用统一的脚本：push 被拒时要 autostash + rebase 重试，单次 push 失败不该让整条流水线挂掉；
      #   continue-on-error 保证即使没推上去，本次部署仍然继续（部署用的是本次运行的产物）。
      - name: Commit and Push Cache to Repository
        continue-on-error: true
        run: |
          # ★ 必须连 web/cftc_dashboard.html 一起提交：日历里的 reportDates 是生成面板时写死进去的，
          #   只提交 report/ 会导致仓库里的面板永远停留在旧日期（每日部署又用这份旧面板覆盖线上）。
          bash .github/scripts/commit_and_push.sh \
            "chore(cftc): auto-update CFTC reports and price cache" \
            report/ web/

      # 4. 同步生成主看板 index.html，保证全站统一上线最新数据
      - name: Generate Main Dashboard (index.html)
        run: |
          python main.py --out index.html

      # 5. 部署至 GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
