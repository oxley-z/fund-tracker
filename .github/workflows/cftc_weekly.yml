name: Weekly CFTC Data Update

on:
  schedule:
    # 每周六北京时间 06:30 执行 (对应 UTC 每周五 22:30)
    - cron: '30 22 * * 5'
  workflow_dispatch: # 支持手动点击立即执行

permissions:
  contents: write  # 必须具有写入权限以持久化提交数据与缓存
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-cftc-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1. 抓取最新一期 CFTC 报告写入 report/
      - name: Fetch Latest CFTC Report
        run: |
          python cftc_position_analysis.py

      # 2. 匹配历史价格，生成 cftc_dashboard.html，更新 JSON 缓存
      - name: Generate CFTC Dashboard & Update Price Cache
        run: |
          python cftc_generate_dashboard.py

      # 3. 将新抓取的原始报告 HTML 及更新后的 JSON 缓存提交并推送到 GitHub 仓库
      - name: Commit and Push Cache to Repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # ★ 必须连 web/cftc_dashboard.html 一起提交：日历里的 reportDates 是生成面板时写死进去的，
          #   只提交 report/ 会导致仓库里的面板永远停留在旧日期（每日部署又用这份旧面板覆盖线上）。
          git add report/ web/
          if git diff --staged --quiet; then
            echo "No new CFTC data to commit."
          else
            git commit -m "chore(cftc): auto-update CFTC reports and price cache"
            git push
          fi

      # 4. 同步生成主看板 index.html，保证全站统一上线最新数据
      - name: Generate Main Dashboard (index.html)
        run: |
          python main.py --out index.html

      # 5. 部署至 GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
