name: Daily Fund Dashboard Update

on:
  schedule:
    # 每天北京时间 22:30 (UTC 14:30) 执行
    - cron: '30 14 * * *'
  workflow_dispatch: # 支持手动点击立即执行

permissions:
  contents: write  # 需要提交 dual 断点与 ETF 看板，保证每天走增量更新
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  daily-build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ★ 每次都基于 report/ 里的最新报告重新生成 CFTC 面板：
      #   仓库里的 web/cftc_dashboard.html 可能滞后于 report/（历史 bug），
      #   若直接沿用，会把线上面板的日历日期回退成旧日期。
      # ★ 不再用 `|| echo` 吞掉退出码：失败时需在 Actions 里显示为失败并打 annotation，
      #   否则「CFTC 面板没更新」永远只能靠人肉猜（脚本正常耗时约 3s：导入 2.3s + 解析 96 期 0.9s）。
      - name: Rebuild CFTC Dashboard
        id: cftc
        continue-on-error: true
        run: python -u cftc_generate_dashboard.py

      - name: Warn if CFTC Rebuild Failed
        if: steps.cftc.outcome == 'failure'
        run: |
          echo "::warning::CFTC 面板重建失败，本次沿用仓库中的版本（web/cftc_dashboard.html）"
          echo "::warning::请滚动到上面的 Rebuild CFTC Dashboard 步骤查看 traceback。"

      # ★ 沪深宽基 ETF 份额看板：基于 data/ 里的断点做增量，生成 web/dual_final_dashboard.html
      - name: Rebuild Dual ETF Dashboard
        id: dual
        continue-on-error: true
        env:
          BROWSER: "true"   # CI 无需真的打开浏览器
        run: python dual_etf_dashboard.py

      - name: Warn if Dual ETF Update Failed
        if: steps.dual.outcome == 'failure'
        run: |
          echo "::warning::ETF 份额看板更新失败，本次沿用仓库中的版本"
          echo "::warning::请检查上面的上交所、深交所和新浪快照诊断日志。"

      # ★ 提交断点与看板，让下一次仍能从最新日期继续增量
      # ★ continue-on-error：main 可能被周更工作流或人工提交推进，push 需要 rebase 重试；
      #   即使最终没推上去，也不该把后面的部署一起拖死（部署用的是本次运行的产物）。
      - name: Commit Dual ETF Data
        if: steps.dual.outcome == 'success'
        continue-on-error: true
        run: |
          bash .github/scripts/commit_and_push.sh \
            "chore(dual): auto-update ETF dashboard" \
            data/ web/dual_final_dashboard.html

      # 运行基金主程序，生成 index.html
      - name: Generate Main Fund Dashboard
        run: |
          python main.py --out index.html

      # ★ data/holdings 是季报持仓缓存：必须提交，否则每天 CI 都是空缓存、全量重抓，
      #   且「只在季报披露窗口内刷新」的策略会失效。
      # ★ 直接提交整个 data/：main.py 会改写 data/index_point_history.json 这类缓存，
      #   漏掉它工作区就一直是脏的，push 被拒时 `git pull --rebase` 会直接报
      #   `cannot pull with rebase: You have unstaged changes`（2026-11-16 就是这样挂的）。
      - name: Commit Macro History & Holdings Cache
        continue-on-error: true
        run: |
          bash .github/scripts/commit_and_push.sh \
            "chore(data): update macro history & holdings cache" \
            data/

      # 部署至 GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
