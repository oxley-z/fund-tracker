name: Daily Fund Dashboard Update

on:
  schedule:
    # 每天北京时间 22:30 (UTC 14:30) 执行
    - cron: '30 14 * * *'
  workflow_dispatch: # 支持手动点击立即执行

permissions:
  contents: read   # 日常任务仅读取，不污染 Git 提交历史
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  daily-build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 确保静态页面中包含 cftc_dashboard.html 供 iframe 引用（基于仓库已有缓存极速生成）
      - name: Ensure CFTC Dashboard Exists
        run: |
          if [ ! -f "cftc_dashboard.html" ]; then
            python cftc_generate_dashboard.py
          fi

      # 运行基金主程序，生成 index.html
      - name: Generate Main Fund Dashboard
        run: |
          python main.py --out index.html

      # 部署至 GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4