name: Daily Fund Dashboard Update

on:
  schedule:
    # 每天北京时间 22:30 (UTC 14:30) 执行
    - cron: '30 14 * * *'
  workflow_dispatch: # 支持手动点击立即执行

permissions:
  contents: read   # 日常任务仅读取，不污染 Git 提交历史
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  daily-build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ★ 每次都基于 report/ 里的最新报告重新生成 CFTC 面板：
      #   仓库里的 cftc_dashboard.html 可能滞后于 report/（历史 bug），
      #   若直接沿用，会把线上面板的日历日期回退成旧日期。
      - name: Rebuild CFTC Dashboard
        run: |
          python cftc_generate_dashboard.py || echo "⚠️ CFTC 面板重建失败，本次沿用仓库中的版本"

      # 运行基金主程序，生成 index.html
      - name: Generate Main Fund Dashboard
        run: |
          python main.py --out index.html

      # 部署至 GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
