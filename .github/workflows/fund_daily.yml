name: Daily Fund Dashboard Update

on:
  schedule:
    # 每天北京时间 22:30 (UTC 14:30) 执行
    - cron: '30 14 * * *'
  workflow_dispatch: # 支持手动点击立即执行

permissions:
  contents: write  # 需要提交 dual 断点与 ETF 看板，保证每天走增量更新
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  daily-build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ★ 每次都基于 report/ 里的最新报告重新生成 CFTC 面板：
      #   仓库里的 web/cftc_dashboard.html 可能滞后于 report/（历史 bug），
      #   若直接沿用，会把线上面板的日历日期回退成旧日期。
      - name: Rebuild CFTC Dashboard
        run: |
          python cftc_generate_dashboard.py || echo "⚠️ CFTC 面板重建失败，本次沿用仓库中的版本"

      # ★ 沪深宽基 ETF 份额看板：基于 data/ 里的断点做增量，生成 web/dual_final_dashboard.html
      - name: Rebuild Dual ETF Dashboard
        id: dual
        continue-on-error: true
        env:
          BROWSER: "true"   # CI 无需真的打开浏览器
          EXCHANGE_PROXY_B64: ${{ secrets.EXCHANGE_PROXY_B64 }}
        run: python dual_etf_dashboard.py

      - name: Warn if Dual ETF Update Failed
        if: steps.dual.outcome == 'failure'
        env:
          EXCHANGE_PROXY_B64: ${{ secrets.EXCHANGE_PROXY_B64 }}
        run: |
          echo "::warning::ETF 份额看板更新失败，本次沿用仓库中的版本"
          if [ -z "$EXCHANGE_PROXY_B64" ]; then
            echo "::warning::未配置大陆代理。GitHub 海外出口可能无法访问上交所/深交所，请优先配置 EXCHANGE_PROXY_B64。"
          fi

      # ★ 提交断点与看板，让下一次仍能从最新日期继续增量
      - name: Commit Dual ETF Data
        if: steps.dual.outcome == 'success'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ web/dual_final_dashboard.html
          if git diff --staged --quiet; then
            echo "No dual ETF changes to commit."
          else
            git commit -m "chore(dual): auto-update ETF dashboard"
            git push || (git pull --rebase origin "$GITHUB_REF_NAME" && git push)
          fi

      # 运行基金主程序，生成 index.html
      - name: Generate Main Fund Dashboard
        run: |
          python main.py --out index.html

      - name: Commit Macro History Cache
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f data/macro_history.json ]; then
            git add data/macro_history.json
            if git diff --staged --quiet; then
              echo "No macro history changes to commit."
            else
              git commit -m "chore(macro): update macro history cache"
              git push || (git pull --rebase origin "$GITHUB_REF_NAME" && git push)
            fi
          else
            echo "Macro history cache was not generated; skipping commit."
          fi

      # 部署至 GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
