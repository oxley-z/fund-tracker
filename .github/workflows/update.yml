name: Daily Fund Dashboard Update

on:
  schedule:
    # 每天北京时间 15:30 执行 (对应 UTC 07:30)
    - cron: '30 7 * * *'
    # 每天北京时间 21:00 执行 (对应 UTC 13:00)
    - cron: '0 13 * * *'

  # 支持 GitHub 网页手动执行
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安装 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: cache
          key: fund-cache-${{ github.run_number }}
          restore-keys: |
            fund-cache-

      # 4. 运行基金数据抓取脚本
      - name: Run script to generate HTML
        run: |
          mkdir -p public
          python main.py --mode prod --out public/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      # 5. 配置 GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 6. 上传整个静态网站
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # 7. 发布到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4