name: Update Fund & CFTC Dashboard

on:
  schedule:
    # 每天北京时间 22:30 (UTC 14:30) 执行（周六凌晨 CFTC 会公布本周二的数据）
    - cron: '30 14 * * *'
  workflow_dispatch: # 支持网页端手动点击运行

permissions:
  contents: write  # 必须开启写入权限，以便回写 report/ 目录中的数据和缓存
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -------------------------------------------------------------
      # 步骤 1：抓取最新一期 CFTC 报告，存放到 report/
      # -------------------------------------------------------------
      - name: 1. Fetch latest CFTC report
        run: |
          python cftc_position_analysis.py

      # -------------------------------------------------------------
      # 步骤 2：生成 CFTC 交互式面板与持久化价格缓存
      # （生成 cftc_dashboard.html 以及更新 report/cftc_价格历史缓存.json）
      # -------------------------------------------------------------
      - name: 2. Generate CFTC Dashboard & Update Cache
        run: |
          python cftc_generate_dashboard.py

      # -------------------------------------------------------------
      # 步骤 3：将抓取到的新周报 HTML 与 JSON 缓存提交并推送到 GitHub
      # -------------------------------------------------------------
      - name: 3. Commit and Push new data & cache to repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 仅暂存 report 目录下的文件（周报 HTML、价格历史缓存 JSON、面板完整数据 JSON）
          git add report/
          
          # 检查是否有新增或修改的内容
          if git diff --staged --quiet; then
            echo "No new CFTC data to commit."
          else
            git commit -m "chore(cftc): auto-update CFTC reports and price cache"
            git push
          fi

      # -------------------------------------------------------------
      # 步骤 4：运行 main.py 生成包含 CFTC 链接的基金主面板 index.html
      # -------------------------------------------------------------
      - name: 4. Run main script to generate index.html
        run: |
          python main.py --out index.html

      # -------------------------------------------------------------
      # 步骤 5：发布静态站点至 GitHub Pages
      # -------------------------------------------------------------
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # 上传整个仓库根目录（包含 index.html、cftc_dashboard.html 与 report/ 目录）

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4