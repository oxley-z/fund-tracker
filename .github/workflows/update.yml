name: Daily Fund Dashboard Update

on:
  schedule:
    # 每天北京时间 15:30 执行 (对应 UTC 07:30)
    - cron: '30 7 * * *'
    # 每天北京时间 21:00 执行 (对应 UTC 13:00)
    - cron: '0 13 * * *'

  # 支持 GitHub 网页手动执行
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # 环境声明有利于 GitHub Pages 状态追踪
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 GitHub Pages（建议放在构建前，检查环境与权限）
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 3. 安装 Python 并启用 pip 依赖缓存
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 4. 安装依赖
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 5. 基金历史数据增量缓存
      - name: Restore fund cache
        uses: actions/cache@v4
        with:
          path: cache
          # 基于日期构建 key，当天内复用，跨天后 fallback 读取旧缓存增量更新
          key: fund-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fund-cache-${{ runner.os }}-

      # 6. 运行基金数据抓取脚本
      - name: Run script to generate HTML
        run: |
          mkdir -p public
          python main.py --mode prod --out public/index.html

      # 7. 上传生成的静态文件
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      # 8. 发布到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4