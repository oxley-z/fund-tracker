name: Daily Fund Dashboard Update

on:
  schedule:
    - cron: '30 7 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - debug

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write                    # ★ 新增：删除 artifact 需要

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: fund-cache-v1-${{ github.run_id }}
          restore-keys: |
            fund-cache-v1-

      - name: Run script to generate HTML
        run: |
          mkdir -p public
          MODE="${{ github.event.inputs.mode || 'prod' }}"
          python main.py --mode "$MODE" --out public/index.html

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: fund-cache-v1-${{ github.run_id }}

      # ★ 新增：删除同 run 里已存在的 github-pages artifact（解决 rerun 409）
      - name: Delete stale github-pages artifact
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = context.runId;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id,
            });
            const targets = artifacts.data.artifacts.filter(a => a.name === 'github-pages');
            for (const a of targets) {
              await github.rest.actions.deleteArtifact({
                owner, repo, artifact_id: a.id,
              });
              console.log(`Deleted stale artifact: ${a.name} (id=${a.id})`);
            }
            if (targets.length === 0) {
              console.log('No stale github-pages artifact found.');
            }

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4